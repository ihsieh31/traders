name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (closed lock)
        # --no-deps + pip check prove requirements.lock is a complete,
        # exact-pinned closure: pip may not silently resolve anything the
        # lock missed (pytest included via requirements-dev.txt).
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock
          pip check

      - name: Run test suite
        # `python -m pytest` puts the repo root on sys.path (the project is
        # not pip-installable). No API keys are configured on purpose: the
        # suite must stay runnable offline.
        run: python -m pytest tests/ -v --tb=short
